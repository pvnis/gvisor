[req]
req_extensions = v3_req
distinguished_name = req_distinguished_name
[req_distinguished_name]
[ v3_req ]
basicConstraints = CA:FALSE
keyUsage = nonRepudiation, digitalSignature, keyEncipherment
extendedKeyUsage = clientAuth, serverAuth
# Go has ignored the Common Name for hostname verification since 1.15, so
# without this the apiserver refuses to call the webhook at all.
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = gvisor-injection-admission-webhook.e2e.svc
DNS.2 = gvisor-injection-admission-webhook.e2e.svc.cluster.local
